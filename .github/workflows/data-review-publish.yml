# Reusable (decision 0024): called by the "review-publish" workflow of a data repository, after its "validate" has run.
# Posts the review of a pull request (comment, labels) and merges it when the review says it is safe.
#
# Why a second workflow: a pull request from a fork gets a read-only token, so it cannot comment. This workflow runs in the context of the
# base repository (with a write token) after "validate" has run. Safety (spec SC-01): it never trusts anything produced by the pull request.
# It redoes the review itself, with the tools of bgdb at the pinned tag and the default branch of the data repository (its data, inbox and
# configuration), on the files the pull request adds under inbox/, downloaded one by one through the API as data. The pull request is never
# checked out (actions/checkout refuses a fork's code in a workflow_run, rightly) and nothing from it is ever executed.
#
# No branch rule is needed (decision 0024): the merge is decided here, by this review, and the ingest commits to master after it. Settings
# (new-data-repo sets them): squash merging allowed, branches deleted after merge.
name: data-review-publish
on:
  workflow_call:
    inputs:
      tools-repository:
        type: string
        required: true
      tools-ref:
        type: string
        required: true
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  publish:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
    steps:
      - name: The data repository, from the default branch (data, inbox, configuration)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          path: base
          persist-credentials: false
      - name: The tools, at the pinned tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          repository: ${{ inputs.tools-repository }}
          ref: ${{ inputs.tools-ref }}
          token: ${{ secrets.BGDB_TOOLS_TOKEN || github.token }}
          path: tools
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4.4.0
        with:
          node-version-file: tools/.node-version
      - name: Link the workspace of the tools
        working-directory: tools
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Find the pull request and read its description
        run: |
          # the open pull request whose last commit is the one validate checked ("pulls of a commit" finds nothing for a fork's commit)
          PR=$(gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" --jq '.[] | "\(.number) \(.head.sha)"' | awk -v s="$HEAD_SHA" '$2 == s { print $1; exit }')
          if [ -z "$PR" ]; then echo "::warning::no open pull request has $HEAD_SHA as its last commit (closed, or a newer commit was pushed): nothing to do"; exit 0; fi
          echo "PR=$PR" >> "$GITHUB_ENV"
          # the REST API, which gives the author association (the pr command of gh does not)
          gh api "repos/$REPO/pulls/$PR" > pr.json
          jq -r '.body // ""' pr.json > pr-body.md
          jq -r '.user.login' pr.json > author.txt
          gh pr diff "$PR" -R "$REPO" --name-only > changed.txt
          case "$(jq -r '.author_association' pr.json)" in FIRST_TIME_CONTRIBUTOR|FIRST_TIMER) echo "WELCOME=--welcome" >> "$GITHUB_ENV";; esac
      - name: The files the pull request adds to inbox/ (downloaded as data, at the commit validate checked)
        if: env.PR != ''
        run: |
          mkdir -p pr
          cp -r base/inbox pr/inbox 2>/dev/null || mkdir -p pr/inbox
          gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | select(.status != "removed") | .filename' > added.txt
          while IFS= read -r F; do
            # a name from the pull request is untrusted: only plain names under inbox/ are fetched, and never written elsewhere
            case "$F" in inbox/*) ;; *) continue ;; esac
            if ! printf '%s' "$F" | grep -Eq '^inbox/[A-Za-z0-9._ +()-]+(/[A-Za-z0-9._ +()-]+)*$' || printf '%s' "$F" | grep -Fq '..'; then echo "skipped: $F"; continue; fi
            mkdir -p "pr/$(dirname "$F")"
            gh api -H "Accept: application/vnd.github.raw" "repos/$HEAD_REPO/contents/$(jq -rn --arg p "$F" '$p | @uri' | sed 's/%2F/\//g')?ref=$HEAD_SHA" > "pr/$F"
          done < added.txt
          find pr/inbox -type f | sed 's|^pr/||' | sort
      - name: Review
        if: env.PR != ''
        run: |
          node tools/packages/cli/bin/bgdb.js review \
            --inbox pr/inbox --data base/data --config base/bgdb.config.json \
            --changed changed.txt --body pr-body.md --author "$(cat author.txt)" $WELCOME \
            --report report.json --comment comment.md || true
      - name: Comment (one comment, updated in place)
        if: env.PR != ''
        run: |
          ID=$(gh api "repos/$REPO/issues/$PR/comments" --jq '[.[] | select(.body | startswith("<!-- bgdb-review -->"))][0].id // empty')
          if [ -n "$ID" ]; then gh api -X PATCH "repos/$REPO/issues/comments/$ID" -F body=@comment.md >/dev/null
          else gh pr comment "$PR" -R "$REPO" --body-file comment.md; fi
      - name: Labels
        if: env.PR != ''
        run: |
          for L in ready auto-merge needs-fix needs-review needs-confirmation partial duplicate enrichment bulk closed; do gh label create "$L" -R "$REPO" --force >/dev/null 2>&1 || true; done
          WANT=$(jq -r '.labels[]' report.json)
          for L in ready auto-merge needs-fix needs-review needs-confirmation partial duplicate enrichment bulk closed; do
            if echo "$WANT" | grep -qx "$L"; then gh pr edit "$PR" -R "$REPO" --add-label "$L" >/dev/null; else gh pr edit "$PR" -R "$REPO" --remove-label "$L" >/dev/null 2>&1 || true; fi
          done
      # Merged only as reviewed: --match-head-commit refuses the merge if a commit was pushed after the one checked here.
      # With BGDB_BOT_TOKEN the merge is made in the maintainer's name, so its push starts the ingest; a push made with the workflow's own
      # token starts no workflow (GitHub rule), and the matches would wait in inbox/ until the ingest is run by hand.
      - name: Merge when the review says it is safe
        if: env.PR != ''
        env:
          GH_TOKEN: ${{ secrets.BGDB_BOT_TOKEN || github.token }}
        run: |
          if [ "$(jq -r '.autoMerge' report.json)" = "true" ]; then gh pr merge "$PR" -R "$REPO" --squash --match-head-commit "$HEAD_SHA"; fi
