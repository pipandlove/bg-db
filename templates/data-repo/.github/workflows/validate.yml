# Checks a pull request that adds matches, with the tools of %%toolsRepository%% at %%toolsRef%% (decision 0024).
# Its check, "validate / validate", is the one the branch rule of master requires.
name: validate
on:
  pull_request:
    paths: ['inbox/**']
permissions:
  contents: read
jobs:
  validate:
    uses: %%toolsRepository%%/.github/workflows/data-validate.yml@%%toolsRef%%
    with:
      tools-repository: %%toolsRepository%%
      tools-ref: %%toolsRef%%
    secrets: inherit
